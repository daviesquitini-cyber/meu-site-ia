<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceSwap de Vídeo - 100% Grátis</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input[type="file"] { background: #333; color: white; cursor: pointer; }
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
        .hidden { display: none; }
        video { width: 100%; margin-top: 15px; border-radius: 8px; background: #000; }
        .loading { color: #ffc107; margin: 15px 0; font-weight: bold; }
        label { display: block; text-align: left; margin-top: 12px; font-size: 14px; color: #aaa; }
    </style>
    <!-- Carrega o cliente oficial do Hugging Face/Gradio de forma segura -->
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@latest/dist/index.min.js";
        window.GradioClient = Client;
    </script>
</head>
<body>

    <div id="login-screen" class="box">
        <h2>Acesso Restrito</h2>
        <input type="password" id="password-input" placeholder="Digite a senha...">
        <button onclick="checkPassword()">Entrar</button>
        <p id="error-msg" style="color: #ff4d4d;"></p>
    </div>

    <div id="app-screen" class="box hidden">
        <h2>Troca de Rosto Grátis</h2>
        <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">Processamento ultra-estável via Gradio API.</p>
        
        <label for="image-input">1. Foto do seu Rosto:</label>
        <input type="file" id="image-input" accept="image/*">
        
        <label for="video-input">2. Vídeo de Destino:</label>
        <input type="file" id="video-input" accept="video/*">
        
        <button onclick="startFaceSwap()">Iniciar Troca de Rosto</button>
        
        <div id="loading" class="loading hidden">Subindo arquivos em fatias e processando... Isso pode levar de 1 a 3 minutos.</div>
        
        <div id="result-container" class="hidden">
            <h3>Resultado:</h3>
            <video id="output-video" controls></video>
        </div>
    </div>

    <script>
        const SENHA_CORRETA = "123";
        const HF_TOKEN = "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"; 

        function checkPassword() {
            if(document.getElementById("password-input").value === SENHA_CORRETA) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
            } else {
                document.getElementById("error-msg").innerText = "Senha incorreta!";
            }
        }

        async function startFaceSwap() {
            const imageFile = document.getElementById("image-input").files[0];
            const videoFile = document.getElementById("video-input").files[0];
            
            if (!imageFile || !videoFile) return alert("Selecione foto e vídeo!");
            
            const loading = document.getElementById("loading");
            const resultContainer = document.getElementById("result-container");
            const outputVideo = document.getElementById("output-video");
            
            loading.classList.remove("hidden");
            resultContainer.classList.add("hidden");
            
            try {
                if (!window.GradioClient) {
                    throw new Error("A biblioteca de conexão ainda está carregando. Aguarde 5 segundos e tente de novo.");
                }

                // Conecta com o espaço de FaceSwap estável do Hugging Face usando seu token
                const app = await window.GradioClient.connect("vincentg/video-face-swap", {
                    hf_token: "Bearer " + HF_TOKEN
                });

                // Envia os arquivos brutos (blobs) diretamente sem converter para base64 gigante!
                const result = await app.predict("/predict", [
                    imageFile, // Foto do rosto
                    videoFile  // Vídeo original
                ]);

                // O Gradio retorna um array com o link do vídeo final no servidor deles
                if (result && result.data && result.data[0]) {
                    const videoData = result.data[0];
                    outputVideo.src = videoData.url;
                    resultContainer.classList.remove("hidden");
                } else {
                    throw new Error("A IA processou mas não retornou o vídeo.");
                }
                
            } catch (error) {
                console.error(error);
                alert("Erro ao processar: " + error.message);
            } finally {
                loading.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
