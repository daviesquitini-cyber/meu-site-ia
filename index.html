<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Privada</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #333; color: white; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        #output-img { width: 100%; margin-top: 15px; border-radius: 8px; }
        .loading { color: #ffc107; margin: 10px 0; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="box">
        <h2>Acesso Restrito</h2>
        <input type="password" id="password-input" placeholder="Senha...">
        <button onclick="checkPassword()">Entrar</button>
        <p id="error-msg" style="color: #ff4d4d;"></p>
    </div>

    <!-- TELA DO APP -->
    <div id="app-screen" class="box hidden">
        <h2>Gerador de IA</h2>
        <input type="text" id="prompt-input" placeholder="O que você quer criar?">
        <button onclick="processIA()">Gerar Imagem</button>
        <div id="loading" class="loading hidden">Processando...</div>
        <img id="output-img" class="hidden">
    </div>

    <script>
        const SENHA_CORRETA = "MinhaSenhaSuperSecreta123"; 
        const HF_TOKEN = "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";

        function checkPassword() {
            if(document.getElementById("password-input").value === SENHA_CORRETA) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
            } else {
                document.getElementById("error-msg").innerText = "Senha incorreta!";
            }
        }

        async function processIA() {
            const promptText = document.getElementById("prompt-input").value;
            if(!promptText) return alert("Digite algo!");
            
            const loading = document.getElementById("loading");
            const img = document.getElementById("output-img");
            
            loading.classList.remove("hidden");
            img.classList.add("hidden");
            
            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0",
                    {
                        headers: { Authorization: `Bearer ${HF_TOKEN}` },
                        method: "POST",
                        body: JSON.stringify({ inputs: promptText }),
                    }
                );

                if (!response.ok) throw new Error("Erro na API");

                const blob = await response.blob();
                img.src = URL.createObjectURL(blob);
                img.classList.remove("hidden");
            } catch (e) {
                alert("Erro ao conectar.");
            } finally {
                loading.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
