<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceSwap de Vídeo Ultra Realista</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input[type="file"] { background: #333; color: white; cursor: pointer; }
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
        .hidden { display: none; }
        video { width: 100%; margin-top: 15px; border-radius: 8px; background: #000; }
        .loading { color: #ffc107; margin: 15px 0; font-weight: bold; }
        label { display: block; text-align: left; margin-top: 12px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="box">
        <h2>Acesso Restrito</h2>
        <input type="password" id="password-input" placeholder="Digite a senha para acessar...">
        <button onclick="checkPassword()">Entrar</button>
        <p id="error-msg" style="color: #ff4d4d;"></p>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="app-screen" class="box hidden">
        <h2>Troca de Rosto em Vídeo (Nuvem)</h2>
        <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">O processamento é feito em servidores de alto desempenho.</p>
        
        <label for="image-input">1. Foto do seu Rosto (PNG/JPG):</label>
        <input type="file" id="image-input" accept="image/*">
        
        <label for="video-input">2. Vídeo de Destino (MP4):</label>
        <input type="file" id="video-input" accept="video/*">
        
        <button onclick="startFaceSwap()">Iniciar Troca de Rosto</button>
        
        <div id="loading" class="loading hidden">Subindo arquivos e processando na nuvem... Isso pode levar de 1 a 3 minutos.</div>
        
        <div id="result-container" class="hidden">
            <h3>Resultado Final:</h3>
            <video id="output-video" controls></video>
        </div>
    </div>

    <script>
        const SENHA_CORRETA = "123";
        // Sua chave do Fal.ai já configurada aqui:
        const CLOUD_TOKEN = "81cbf999-ba28-4dda-8b19-401d32f9c377:a89a9ad3a0507e4a9326cc1b851e8021"; 

        function checkPassword() {
            if(document.getElementById("password-input").value === SENHA_CORRETA) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
            } else {
                document.getElementById("error-msg").innerText = "Senha incorreta!";
            }
        }

        // Transforma o arquivo em link temporário ou base64 para enviar
        function fileToDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function startFaceSwap() {
            const imageFile = document.getElementById("image-input").files[0];
            const videoFile = document.getElementById("video-input").files[0];
            
            if (!imageFile || !videoFile) {
                return alert("Por favor, selecione a foto e o vídeo antes de iniciar!");
            }
            
            const loading = document.getElementById("loading");
            const resultContainer = document.getElementById("result-container");
            const outputVideo = document.getElementById("output-video");
            
            loading.classList.remove("hidden");
            resultContainer.classList.add("hidden");
            
            try {
                const base64Image = await fileToDataURL(imageFile);
                const base64Video = await fileToDataURL(videoFile);
                
                // Requisição para a API do Fal.ai utilizando o modelo de FaceSwap de vídeo
                const response = await fetch("https://queue.fal.run/fal-ai/face-swap/video", {
                    method: "POST",
                    headers: {
                        "Authorization": `Key ${CLOUD_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        base64_image: base64Image,
                        base64_video: base64Video
                    })
                });
                
                if (!response.ok) throw new Error("Erro ao processar na API de nuvem.");
                
                const result = await response.json();
                
                // Exibe o vídeo gerado de volta no seu site
                outputVideo.src = result.video.url;
                resultContainer.classList.remove("hidden");
                
            } catch (error) {
                console.error(error);
                alert("Ocorreu um erro no servidor de nuvem. Verifique se o seu saldo gratuito do Fal.ai está ativo.");
            } finally {
                loading.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
