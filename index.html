<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu FaceSwap Privado</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .box { max-width: 500px; margin: 50px auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        input { background: #333; color: white; font-size: 16px; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; }
        #loading { margin: 15px 0; color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="box">
        <h2>Acesso Restrito</h2>
        <p>Insira a senha para acessar a IA:</p>
        <input type="password" id="password-input" placeholder="Digite a senha...">
        <button onclick="checkPassword()">Entrar</button>
        <p id="error-msg" style="color: #ff4d4d; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- TELA DO APP -->
    <div id="app-screen" class="box hidden">
        <h2>IA Privada (Sem Custos)</h2>
        <p>Insira o que você quer gerar na imagem:</p>
        
        <input type="text" id="prompt-input" placeholder="Ex: Um gato jogando videogame, estilo anime">
        <button onclick="processIA()">Gerar Imagem</button>
        
        <div id="loading" class="hidden">Conectando à IA gratuita... Aguarde...</div>
        <img id="output-img" class="hidden" alt="Resultado da IA">
    </div>

    <script>
        const SENHA_CORRETA = "MinhaSenhaSuperSecreta123"; 
        
        // COLE AQUI A SUA TOKEN DO HUGGING FACE QUE COMEÇA COM "hf_"
        const HF_TOKEN = "SUA_TOKEN_AQUI"; 

        function checkPassword() {
            const typedPassword = document.getElementById("password-input").value;
            if(typedPassword === SENHA_CORRETA) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
            } else {
                document.getElementById("error-msg").innerText = "Senha incorreta!";
            }
        }

        async function processIA() {
            const promptText = document.getElementById("prompt-input").value;
            if(!promptText) return alert("Digite o que você quer gerar!");
            
            const loadingDiv = document.getElementById("loading");
            const outputImg = document.getElementById("output-img");
            
            loadingDiv.classList.remove("hidden");
            outputImg.classList.add("hidden");
            
            try {
                // Envia o prompt direto para o modelo Stable Diffusion do Hugging Face
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0",
                    {
                        headers: { Authorization: `Bearer ${HF_TOKEN}` },
                        method: "POST",
                        body: JSON.stringify({ inputs: promptText }),
                    }
                );

                if (!response.ok) throw new Error("Erro na API da IA");

                const blob = await response.blob();
                outputImg.src = URL.createObjectURL(blob);
                outputImg.classList.remove("hidden");
            } catch (e) {
                console.error(e);
                alert("Erro ao gerar imagem. Verifique se colou a sua Token corretamente.");
            } finally {
                loadingDiv.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
